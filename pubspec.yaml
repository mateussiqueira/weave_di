name: weave_di
description: >-
  Dependency injection and typed routing for Flutter in one package.
  Scopes, parameterized factories, circular-dependency detection,
  route guards, middleware and transitions. No code generation.
version: 2.2.0
repository: https://github.com/digital-core/weave
homepage: https://github.com/digital-core/weave
issue_tracker: https://github.com/digital-core/weave/issues
topics:
  - dependency-injection
  - routing
  - navigation
  - modular
  - guards

environment:
  sdk: ^3.12.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
